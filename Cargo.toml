[package]
name = "yggdrasill"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "yggdrasill"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
gix = { version = "0.87.1", default-features = false, features = ["sha1"] }
ratatui = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.8"
